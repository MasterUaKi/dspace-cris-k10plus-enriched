# Version: 1.1.0 | Release Date: 2026-11-17
# [DE] Konfiguration und Metadaten-Mapping für den K10plus + OpenAlex Enriched Provider (DSpace-CRIS 9)
# [EN] Configuration and metadata field mappings for K10plus + OpenAlex Enriched Provider (DSpace-CRIS 9)

# --- [DE] Verbindungs- und Abfrageeinstellungen / [EN] Connection & Query Settings ---
k10plus-enriched.sru.url = https://sru.k10plus.de/opac-de-627
k10plus-enriched.sru.timeout = 12
# [DE] CQL-Vorlage für Freitext-Suchen (%s = maskierter Suchbegriff)
# [EN] Custom CQL template for free-text queries (%s = escaped query placeholder)
k10plus-enriched.sru.cql.template = (pica.tit="%s" or pica.per="%s")

# --- [DE] Lokale Solr-Felder für CRIS-Authority-Abgleich / [EN] CRIS Authority Lookup Fields in Local Solr ---
k10plus-enriched.authority.person.gnd-field = veroPE.identifier.gnd
k10plus-enriched.authority.person.orcid-field = person.identifier.orcid
k10plus-enriched.authority.orgunit.title-field = dc.title

# --- [DE] Metadaten-Mapping (kommagetrennte schema.element[.qualifier], oder 'none' zum Deaktivieren) ---
# --- [EN] Metadata Field Mappings (comma-separated schema.element[.qualifier], or 'none' to disable) ---
k10plus-enriched.map.ppn = dc.identifier.other, cris.sourceId
k10plus-enriched.map.title = dc.title
k10plus-enriched.map.subTitle = dc.title.subtitle
k10plus-enriched.map.author = dc.contributor.author
k10plus-enriched.map.authorOrcid = cris.author.orcid
k10plus-enriched.map.publisher = dc.publisher
k10plus-enriched.map.publicationPlace = veroPU.bibliographicCitation.publisherPlace
k10plus-enriched.map.issuedYear = dc.date.issued
k10plus-enriched.map.isbn = dc.identifier.isbn
k10plus-enriched.map.issn = dc.identifier.issn
k10plus-enriched.map.doi = dc.identifier.doi
k10plus-enriched.map.language = dc.language.iso
k10plus-enriched.map.extent = dc.format.extent
k10plus-enriched.map.abstract = dc.description.abstract
k10plus-enriched.map.subject = dc.subject
k10plus-enriched.map.journalTitle = dc.relation.ispartof
k10plus-enriched.map.uri = dc.identifier.uri
k10plus-enriched.map.affiliation = oairecerif.author.affiliation
k10plus-enriched.map.orgUnit = vero.OrgUnit
